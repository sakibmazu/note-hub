<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Notonomy — Your Knowledge{% endblock %}</title>

    <meta name="description"
          content="Notonomy — শিক্ষার্থীদের নোট খোঁজা, পড়া ও শেয়ার করার প্ল্যাটফর্ম।">

    <meta name="theme-color" content="#10432f">

    <style>
        :root {
            --primary: #15803d;
            --primary-dark: #10432f;
            --primary-light: #dcfce7;
            --accent: #d7ef91;
            --text: #17251d;
            --muted: #647067;
            --background: #f5f8f6;
            --white: #ffffff;
            --border: #e2e9e4;
            --radius: 16px;
            --shadow: 0 8px 28px rgba(16, 67, 47, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Noto Sans Bengali", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        /* Navbar */

        .site-header {
            width: 100%;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 1440px;
            min-height: 88px;
            margin: 0 auto;
            padding: 16px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            color: var(--primary-dark);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            background: var(--primary-light);
            border-radius: 13px;
            padding: 7px;
        }

        .brand-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
        }

        nav a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        nav a:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        nav a.login-link {
            background: #e8edf2;
            color: #24352b;
        }

        nav a.register-link {
            background: var(--primary);
            color: white;
        }

        nav a.register-link:hover {
            background: var(--primary-dark);
            color: white;
        }

        /* Main content */

        main {
            width: 100%;
            min-height: calc(100vh - 160px);
        }

        .container {
            max-width: 1280px;
            width: 90%;
            margin: 0 auto;
        }

        /* Footer */

        .site-footer {
            margin-top: 60px;
            padding: 28px 6%;
            background: var(--primary-dark);
            color: #e7f1e9;
            text-align: center;
            font-size: 14px;
        }

        .site-footer p {
            margin: 0;
        }

        .site-footer strong {
            color: var(--accent);
        }

        /* Responsive */

        @media (max-width: 768px) {
            .header-inner {
                min-height: auto;
                padding: 14px 5%;
                flex-direction: column;
                gap: 14px;
            }

            .brand {
                font-size: 25px;
            }

            .brand-icon {
                width: 38px;
                height: 38px;
            }

            nav {
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            nav a {
                padding: 10px 14px;
                font-size: 14px;
            }

            .container {
                width: 92%;
            }
        }

        @media (max-width: 420px) {
            nav a {
                padding: 9px 11px;
                font-size: 13px;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
    {% block head %}{% endblock %}
</head>

<body>

    <!-- Navbar -->
    <header class="site-header">
        <div class="header-inner">

            <a class="brand" href="{{ url_for('index') }}">
                <span class="brand-icon">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path
                            d="M8 10.5C8 8.8 9.4 7.5 11.2 7.5H36.8C38.6 7.5 40 8.8 40 10.5V37.5H11.2C9.4 37.5 8 36.2 8 34.5V10.5Z"
                            fill="currentColor"
                            opacity=".16"/>

                        <path
                            d="M12 12H35V34H12C9.8 34 8 35.8 8 38V15.5C8 13.6 9.8 12 12 12Z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linejoin="round"/>

                        <path
                            d="M18 19H29M18 25H29M18 31H25"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"/>

                        <path
                            d="M35 12V34"
                            stroke="currentColor"
                            stroke-width="3"
                            stroke-linecap="round"/>
                    </svg>
                </span>

                <span>Notonomy</span>
            </a>

            <nav>
                <a href="{{ url_for('index') }}">
                    নোট খুঁজুন
                </a>

                <a href="{{ url_for('login') }}" class="login-link">
                    লগ ইন
                </a>

                <a href="{{ url_for('register') }}" class="register-link">
                    রেজিস্ট্রেশন
                </a>
            </nav>

        </div>
    </header>

    <!-- Page Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>
            © 2026 <strong>Notonomy</strong> —
            Learn together. Share knowledge.
        </p>
    </footer>

    {% block extra_js %}{% endblock %}

</body>
</html>
